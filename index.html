<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="POEMS by snipxr, a digital poetry book.">
<title>POEMS — by snipxr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%B6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap">
<style>
:root{--bg:#f5eee2;--ink:#2a2420;--mute:#8d8173;--accent:#a8552f;--card:#fbf6ec;--line:rgba(120,95,70,.22);--g1:rgba(230,185,138,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--ink:#ece6da;--mute:#8f8c97;--accent:#e0a878;--card:#171a22;--line:rgba(255,255,255,.1);--g1:rgba(90,70,160,.45)}}
:root[data-theme="dark"]{--bg:#0f1117;--ink:#ece6da;--mute:#8f8c97;--accent:#e0a878;--card:#171a22;--line:rgba(255,255,255,.1);--g1:rgba(90,70,160,.45)}
body.night{--bg:#060818;--ink:#e8e5f8;--mute:#8a88b0;--accent:#b7a6ff;--card:#0d1030;--line:rgba(180,170,255,.16);--g1:rgba(60,50,170,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.6;min-height:100vh;overflow-x:hidden;transition:background .9s,color .6s}
#aura{position:fixed;left:50%;top:-30vmax;width:90vmax;height:90vmax;margin-left:-45vmax;border-radius:50%;background:radial-gradient(circle,var(--g1),transparent 62%);pointer-events:none;z-index:0;animation:sway 30s ease-in-out infinite alternate;will-change:transform}
@keyframes sway{to{transform:translate3d(14vw,10vh,0) scale(1.15)}}
#glow{position:fixed;left:0;top:0;width:360px;height:360px;margin:-180px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,var(--accent),transparent 65%);opacity:.12;will-change:transform}
canvas#amb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--accent);z-index:20;transform:scaleX(0);transform-origin:0 50%}
nav{position:fixed;top:0;left:0;right:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 22px;background:linear-gradient(var(--bg) 55%,transparent);font-family:Inter,system-ui,sans-serif}
#brand{font-family:Cinzel,Georgia,serif;letter-spacing:.32em;font-size:13px;cursor:pointer;white-space:nowrap}
#brand i{color:var(--accent);font-style:normal}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font-family:Inter,system-ui,sans-serif;font-size:12px;letter-spacing:.05em;background:var(--card);color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer;transition:color .2s,border-color .2s,transform .2s}
button:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
button.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#app{position:relative;z-index:3;transition:opacity .16s,transform .16s}
#app.out{opacity:0;transform:translateY(8px)}
main{max-width:980px;margin:0 auto;padding:90px 22px 90px}
.hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero h1{font-family:Cinzel,Georgia,serif;font-weight:400;font-size:clamp(46px,13vw,116px);letter-spacing:.2em;margin:0 -.2em 0 0;user-select:none;cursor:default}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(24px);animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.06s + .05s)}
@keyframes in{to{opacity:1;transform:none}}
.hero p{font-style:italic;font-size:24px;color:var(--mute);margin:10px 0 0;opacity:0;animation:in .8s .5s forwards}
.cue{margin-top:50px;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);cursor:pointer;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(7px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 26px;justify-content:center}
.chip.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;overflow:hidden;padding:26px 24px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;opacity:0;animation:in .6s forwards;animation-delay:calc(var(--i)*.05s)}
.card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 14px 36px -18px var(--accent)}

.card:hover b{opacity:.28}

.card h4{font-family:Cinzel,serif;font-weight:400;font-size:21px;letter-spacing:.05em;margin:10px 0 8px}

.orn{color:var(--accent);letter-spacing:1em;margin:20px 0 36px;opacity:.7}

.item small{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.15em;color:var(--mute);text-transform:uppercase}
.banner{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);text-align:center}
#whisper{position:fixed;left:50%;top:44%;transform:translate(-50%,-46%);z-index:30;width:86vw;max-width:700px;text-align:center;font-size:clamp(24px,5vw,38px);font-style:italic;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .9s,transform 1.4s;text-shadow:0 0 24px var(--bg),0 0 6px var(--bg)}

.sg{font:italic 400 100px 'Cormorant Garamond',Georgia,serif;fill:transparent;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:520;stroke-dashoffset:520;animation:dr 2.2s ease forwards,fl 1s 2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl{to{fill:var(--accent)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.wisp{position:absolute;width:16px;height:16px;border-radius:50%;pointer-events:auto;cursor:pointer;background:radial-gradient(circle,#fff,var(--accent) 45%,transparent 70%);box-shadow:0 0 18px 6px var(--accent);transition:transform 7s ease-in-out;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.moon{position:fixed;left:50%;top:14vh;margin-left:-55px;width:110px;height:110px;border-radius:50%;z-index:1;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8d9a8 65%,#c9b985);box-shadow:0 0 100px 40px rgba(235,220,160,.28);transform:translateY(70vh);opacity:0;transition:transform 4.5s cubic-bezier(.16,.8,.3,1),opacity 2s}
.moon.up{transform:none;opacity:1}
.ink{position:fixed;width:24px;height:24px;margin:-12px;border-radius:50%;background:var(--accent);z-index:24;pointer-events:none;opacity:0;animation:ink 2.2s cubic-bezier(.3,.6,.2,1) forwards;will-change:transform}
@keyframes ink{20%{opacity:.75}to{transform:scale(var(--s));opacity:0}}
.fw{position:fixed;font-family:Cinzel,serif;font-size:14px;letter-spacing:.2em;color:var(--accent);z-index:3;pointer-events:none;animation:flt 12s ease-out forwards;white-space:nowrap}
@keyframes flt{from{transform:translateY(0);opacity:0}15%{opacity:.85}to{transform:translateY(-90vh);opacity:0}}
.clk{margin-top:14px;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.2em;color:var(--mute);cursor:pointer;opacity:0;animation:in .8s .9s forwards}

button:active{transform:scale(.94)}
#whisper{top:auto;bottom:calc(10vh + env(safe-area-inset-bottom,0px));width:auto;max-width:min(88vw,500px);padding:16px 26px;background:var(--card);border:1px solid var(--accent);border-radius:18px;font-size:clamp(18px,4vw,23px);line-height:1.4;box-shadow:0 20px 60px -20px var(--accent);text-shadow:none;transform:translate(-50%,16px)}
#whisper.on{transform:translate(-50%,0)}
#whisper.mid{top:34%;bottom:auto}
.wsub{display:block;font:400 10px Inter,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-style:normal}
.clkw{position:relative;display:inline-block;margin-top:18px}
.clk{margin:0;padding:9px 20px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);transition:border-color .2s}
.clk:hover{border-color:var(--accent)}
.pop{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);width:min(88vw,330px);padding:16px 18px;background:var(--card);border:1px solid var(--accent);border-radius:16px;box-shadow:0 24px 60px -24px var(--accent);text-align:left;z-index:12;animation:popin .3s cubic-bezier(.2,.9,.3,1.2)}
.pop:before{content:'';position:absolute;top:-8px;left:50%;margin-left:-7px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--accent);border-top:1px solid var(--accent);transform:rotate(45deg)}
@keyframes popin{from{opacity:0;transform:translate(-50%,-8px) scale(.96)}}
.pop h5{margin:0 0 8px;font:400 10px Inter,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.pop div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);font:400 13px Inter,sans-serif;letter-spacing:.03em;cursor:pointer;letter-spacing:.03em;transition:color .2s}
.pop div:hover,.pop div.me{color:var(--accent)}
.pop small{display:block;margin-top:9px;font:300 11px Inter,sans-serif;color:var(--mute);letter-spacing:.04em}
#panel{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
#panel.on{display:flex}
.pbox{width:min(90vw,440px);max-height:82vh;overflow:auto;padding:26px;background:var(--card);border:1px solid var(--accent);border-radius:20px;box-shadow:0 30px 80px -30px var(--accent);animation:in .35s forwards}
.pr{display:flex;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:18px;line-height:1.35}
.pr b{font-weight:400;color:var(--accent);min-width:16px}
.pr.no{color:var(--mute);font-style:italic}
#hp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:16}
#hp.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.4);color:var(--accent);border-color:var(--accent)}}
.card{opacity:1;animation:cin .6s both;animation-delay:calc(var(--i)*.05s);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
@keyframes cin{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
.card:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 65%);opacity:0;transition:opacity .3s}
.card:hover:after{opacity:1}
.ln{opacity:0;transform:none;animation:wr .95s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:calc(var(--i)*.16s + .1s)}
@keyframes wr{from{opacity:0;clip-path:inset(-10% 100% -10% 0);transform:translateY(6px)}to{opacity:1;clip-path:inset(-10% 0 -10% 0)}}
.hero h1 span{animation:sp .8s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--d)*.07s + .05s)}
@keyframes sp{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}
.rl{height:1px;width:0;background:var(--accent);margin:18px auto 2px;animation:rl 1s .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rl{to{width:140px}}
#app.out{opacity:0;transform:translate3d(calc(var(--d,0)*-44px),calc((1 - var(--d,0)*var(--d,0))*10px),0)}
@keyframes ent{from{opacity:0;transform:translate3d(calc(var(--d,0)*44px),calc((1 - var(--d,0)*var(--d,0))*12px),0)}}
.moon{left:auto;right:7vw;margin-left:0;top:12vh;width:92px;height:92px}
@media(max-width:600px){.moon{width:60px;height:60px;right:6vw;top:14vh}.pbox{padding:20px}}
@media(max-width:600px){nav{padding-left:14px;padding-right:12px}#brand{font-size:0;letter-spacing:0}#brand i{font-size:18px}.tools{flex-wrap:nowrap;gap:4px}button{padding:6px 10px;font-size:11px}.clk{font-size:11px;letter-spacing:.06em;padding:8px 12px}main{padding-left:16px;padding-right:16px}#hp{opacity:.85;padding:5px 10px}}
.pop p{margin:0;text-align:center}.pbig{font:400 34px Cinzel,Georgia,serif;letter-spacing:.06em}.pzn{font:400 12px Inter,sans-serif;letter-spacing:.12em;color:var(--mute);margin-top:2px!important}.pph{font:400 12px Inter,sans-serif;letter-spacing:.06em;color:var(--accent);margin:8px 0 12px!important;white-space:pre}.pop h5{margin:14px 0 2px}.pl{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button,.card,.pn div{min-height:36px}
.ed input[type=password]{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:20px;outline:none}
.lg{max-width:380px;margin-top:10vh}.msg{color:var(--accent);font-style:italic;min-height:1.6em;margin-top:10px}
.errbox{text-align:center;padding:90px 10px;color:var(--mute);font-style:italic;font-size:22px}
@media(max-width:600px){.tools{flex-wrap:wrap!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

.pph{white-space:normal;line-height:1.5}
.psun{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font:400 12px Inter,sans-serif;letter-spacing:.06em;color:var(--mute);margin:-6px 0 12px!important}
.pop{max-width:calc(100vw - 24px);overflow-wrap:anywhere}
.pop div span:first-child{min-width:0}

<body>
<div id="aura"></div><div id="glow"></div>
<canvas id="amb"></canvas><div id="bar"></div>
<nav><span id="brand" onclick="act.brand()" role="button" tabindex="0">SNIPXR <i>✦</i></span><span class="tools" id="tools"></span></nav>
<div id="app"></div>
<div id="fx"></div>
<div id="whisper"></div><button id="hp" onclick="act.hidden()">✦ 0/14</button><div id="panel" onclick="this.classList.remove('on')"></div>
<noscript><p style="text-align:center;padding:40px">POEMS needs JavaScript to turn its pages.</p></noscript>
<script>
/* App core: state, data loading from poems.json, GitHub helpers, boot. */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S={title:'POEMS',tagline:'by snipxr',poems:[],updated_at:''},view='toc',cur=null,eid=null,author=false,PV=null,WK=null,BASE='',ERR='',LERR='',dirty=false,PENDING='';
let found=new Set(),clicks=0,flt='All',mx=innerWidth/2,my=innerHeight/2;
function guessRepo(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);if(h.endsWith('.github.io')){const o=h.split('.')[0];return o+'/'+(p[0]&&!/\./.test(p[0])?p[0]:h)}return''}
let TOKEN=ls.get('gh_token')||'',REPO=ls.get('gh_repo')||guessRepo(),BR='main';
const live=()=>S.poems.filter(p=>p.published);
async function gh(path,opt={},tok){const h={Accept:'application/vnd.github+json',Authorization:'Bearer '+(tok||TOKEN)};if(opt.body)h['Content-Type']='application/json';
let r;try{r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'})}catch(e){const x=new Error('Cannot reach GitHub. Check your internet.');x.status=0;throw x}
const j=await r.json().catch(()=>null);if(!r.ok){const x=new Error((j&&j.message)||'GitHub error '+r.status);x.status=r.status;throw x}return j}
const b64=s=>{const b=new TextEncoder().encode(s);let t='';b.forEach(c=>t+=String.fromCharCode(c));return btoa(t)};
async function commit(data){let sha;try{sha=(await gh(`/repos/${REPO}/contents/poems.json?ref=${BR}`)).sha}catch(e){if(e.status!==404)throw e}

if(best){if(best.tabIndex<0)best.tabIndex=0;best.focus();best.scrollIntoView({block:'center',behavior:'smooth'})}else if(dir==='down')scrollBy({top:220,behavior:'smooth'});else if(dir==='up')scrollBy({top:-220,behavior:'smooth'})}
window.moveFocus=moveFocus;
addEventListener('keydown',e=>{if(!e.isTrusted||e.key.indexOf('Arrow')!==0||typing(e)||e.altKey||e.ctrlKey||e.metaKey)return;if(view==='poem'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
const a=document.activeElement;if(!a||a===document.body||!focusables().includes(a))return;e.preventDefault();moveFocus(e.key.slice(5).toLowerCase())});
const key=k=>window.dispatchEvent(new KeyboardEvent('keydown',{key:k}));
function press(k){const map={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',a:'a',b:'b'};if(map[k])key(map[k]);
if(k==='left'||k==='right'){if(view!=='poem')moveFocus(k)}
else if(k==='up'||k==='down'){if(view==='poem')scrollBy({top:k==='up'?-240:240,behavior:'smooth'});else moveFocus(k)}
else if(k==='a'){const a=document.activeElement;if(a&&a!==document.body&&a.click)a.click()}
else if(k==='b'||k==='start'){if(document.querySelector('.pop'))closePop();else if(view==='poem'||view==='edit')act.home()}}
function poll(){const p=pads().find(Boolean);if(!p||document.hidden)return;const b=i=>p.buttons[i]&&p.buttons[i].pressed,x=p.axes||[];
const s={up:b(12)||x[1]<-.6,down:b(13)||x[1]>.6,left:b(14)||x[0]<-.6,right:b(15)||x[0]>.6,a:b(0),b:b(1),start:b(9)};for(const k in s){if(s[k]&&!prev[k])press(k);prev[k]=s[k]}}
addEventListener('gamepadconnected',()=>{if(!tickId)tickId=setInterval(poll,80);whisper('Controller connected: D-pad moves, A selects, B goes back.',3500)});
addEventListener('gamepaddisconnected',()=>{if(!pads().some(Boolean)){clearInterval(tickId);tickId=null}});
if(pads().some(Boolean)&&!tickId)tickId=setInterval(poll,80);
})();
</script>
</body>
